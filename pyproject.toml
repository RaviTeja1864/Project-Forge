[project]
name = "projectforge"
version = "0.1.0"
description = "Evidence-driven engineering project planning platform"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.2",
    "djangorestframework==3.18.3",
    "django-cors-headers==4.9.0",
    "psycopg[binary]==3.3.6",
    "reportlab==4.5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"backend/**/migrations/*.py" = ["RUF012"]
"backend/**/models.py" = ["RUF012"]
"backend/**/views.py" = ["RUF012"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]
